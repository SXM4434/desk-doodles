<!doctype html>
<!-- VISUAL 3D SWEEP harness — repo-side tool only, NOT part of the Make
     drag-drop set and NOT wired into the app. Served by the dev/preview server
     at /tools/3d/visual-3d-sweep.html. Driven headless by
     tools/3d/visual-3d-sweep.mjs: renders the REAL audit catalog (PinShape +
     PegToolShape, the deduped 197) through the REAL Stroke3DScene and captures
     both the CLEAN SVG ground-truth and the 3D GL render at 2 orbit angles per
     mode, via the window.__vsweep API. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Visual 3D sweep harness</title>
    <style>
      :root { --dir-bg: #fdfcf9; --dir-text-primary: #3b362e; --dir-border: #d8d2c6; }
      body { margin: 0; font: 12px/1.4 monospace; background: #fdfcf9; color: #3b362e; }
      #capture { width: 320px; }
      #label {
        height: 22px; line-height: 22px; padding: 0 6px; font-size: 12px;
        font-weight: 700; background: #efe9dd; color: #3b362e;
        white-space: nowrap; overflow: hidden;
      }
      #cleanwrap {
        width: 320px; height: 150px; box-sizing: border-box;
        border: 1px solid #d8d2c6; border-bottom: none;
        background: #fdfcf9; display: block; position: relative;
      }
      #cleanwrap::before {
        content: "CLEAN"; position: absolute; top: 2px; left: 4px;
        font-size: 9px; color: #a89f8d; font-weight: 700; z-index: 2;
      }
      #clean { width: 100%; height: 100%; }
      #scene {
        width: 320px; height: 320px; border: 1px solid #d8d2c6;
        box-sizing: border-box; position: relative;
      }
      #scene::before {
        content: "3D"; position: absolute; top: 2px; left: 4px;
        font-size: 9px; color: #a89f8d; font-weight: 700; z-index: 2;
        pointer-events: none;
      }
      #sampler { position: absolute; left: -10000px; top: 0; }
    </style>
  </head>
  <body>
    <div id="capture">
      <div id="label">—</div>
      <div id="cleanwrap"><div id="clean"></div></div>
      <div id="scene"></div>
    </div>
    <div id="sampler"></div>
    <script type="module" src="/tools/3d/visual-3d-sweep-harness.tsx"></script>
  </body>
</html>
