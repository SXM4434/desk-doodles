<!doctype html>
<!-- 3D audit-catalog sweep harness — repo-side tool only, NOT part of the Make
     drag-drop set and NOT wired into the app. Served by the dev server at
     http://localhost:5182/tools/3d/audit-sweep.html. Driven headless by
     tools/3d/audit-sweep.mjs: samples the REAL audit-catalog shapes
     (PinShape 93 + PegToolShape 104) into stroke point arrays and renders
     them through the REAL Stroke3DScene, one shape × geometry-mode at a time,
     via the window.__sweep API. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D audit-catalog sweep harness</title>
    <style>
      :root { --dir-bg: #fdfcf9; --dir-text-primary: #3b362e; --dir-border: #d8d2c6; }
      body { margin: 0; font: 12px/1.4 monospace; background: #fdfcf9; color: #3b362e; }
      #capture { width: 320px; }
      #label {
        height: 22px; line-height: 22px; padding: 0 6px; font-size: 13px;
        font-weight: 700; background: #efe9dd; color: #3b362e;
        white-space: nowrap; overflow: hidden;
      }
      #scene { width: 320px; height: 320px; border: 1px solid #d8d2c6; box-sizing: border-box; }
      #sampler { position: absolute; left: -10000px; top: 0; }
    </style>
  </head>
  <body>
    <div id="capture">
      <div id="label">—</div>
      <div id="scene"></div>
    </div>
    <div id="sampler"></div>
    <script type="module" src="/tools/3d/audit-sweep-harness.tsx"></script>
  </body>
</html>
