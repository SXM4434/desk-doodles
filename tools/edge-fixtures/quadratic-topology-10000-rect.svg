  <rect x="12" y="0" width="10" height="10" fill="#333"/>
  <rect x="24" y="0" width="10" height="10" fill="#444"/>
  <rect x="36" y="0" width="10" height="10" fill="#555"/>
  <rect x="0" y="12" width="10" height="10" fill="#666"/>
  <rect x="12" y="12" width="10" height="10" fill="#777"/>
  <rect x="24" y="12" width="10" height="10" fill="#888"/>
  <rect x="36" y="12" width="10" height="10" fill="#999"/>
