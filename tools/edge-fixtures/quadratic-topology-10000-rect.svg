<!-- PROPOSED FIXTURE (gap-hunt 2026-06-13). NOT wired to an assertion yet.
     PURPOSE: signals.ts:extractTopology runs an O(n^2) sibling pass
     (ctx.siblings.forEach inside walkInto's per-child loop). There is NO
     element-count cap anywhere in the signals walk or SvgStyleTransform.
     A large-but-not-hostile upload (a detailed auto-traced logo, a CAD export)
     can have thousands of siblings -> the classify step goes quadratic and
     hangs the tab on a single innocent upload. The full 10000-rect version is
     generated programmatically by the harness; this is a 200-rect smoke seed
     a human can open. EXPECTED (today): unknown - never tested. The harness
     should assert classify completes under a perf ceiling. -->
