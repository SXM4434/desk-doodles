<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Edge-case torture test — one shape per 18-scope-audit policy row fixed
       2026-06-10. Upload via /canvas → Upload SVG and verify each behavior.
       Expected results listed per element. -->
  <defs>
    <linearGradient id="tortureGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#dddddd"/>
    </linearGradient>
    <pattern id="torturePat" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#333333"/>
    </pattern>
    <clipPath id="tortureClip">
      <circle cx="80" cy="220" r="30"/>
    </clipPath>
    <mask id="tortureMask">
      <rect x="0" y="0" width="400" height="300" fill="white"/>
      <circle cx="200" cy="230" r="20" fill="black"/>
    </mask>
    <filter id="tortureBlur"><feGaussianBlur stdDeviation="2"/></filter>
    <symbol id="tortureSymbol"><rect x="0" y="0" width="40" height="40" fill="#222222"/></symbol>
  </defs>
  <style>.torture-class { fill: #555555; }</style>

  <!-- 1. GRADIENT fill → expect: mid-density hachure (average stop darkness ~0.5), NOT uniform 0.75 -->
  <rect x="20" y="20" width="70" height="50" fill="url(#tortureGrad)" stroke="#111111"/>

  <!-- 2. PATTERN fill → expect: NO hachure marks (pass-through), outline only -->
  <rect x="110" y="20" width="70" height="50" fill="url(#torturePat)" stroke="#111111"/>

  <!-- 3. CSS-CLASS fill (no fill attr) → expect: hachure marks (mid darkness), NOT treated as line art -->
  <rect x="200" y="20" width="70" height="50" class="torture-class" stroke="#111111"/>

  <!-- 4. currentColor resolving to black → expect: dense marks (darkness ~1.0), not 0.75 -->
  <rect x="290" y="20" width="70" height="50" fill="currentColor" stroke="#111111" color="#000000"/>

  <!-- 5. TINY shapes (< 40px²) → expect: SOLID fills, no micro-hachure -->
  <rect x="30" y="100" width="5" height="5" fill="#111111"/>
  <circle cx="60" cy="103" r="3" fill="#111111"/>
  <rect x="80" y="100" width="6" height="4" fill="#333333"/>

  <!-- 6. CLIPPED shape → expect: marks stay INSIDE the circular clip -->
  <rect x="40" y="180" width="80" height="80" fill="#222222" clip-path="url(#tortureClip)"/>

  <!-- 7. MASKED shape → expect: rendered completely UNTOUCHED (pass-through) -->
  <rect x="160" y="190" width="80" height="80" fill="#444444" mask="url(#tortureMask)"/>

  <!-- 8. FILTERED shape → expect: rendered completely UNTOUCHED (pass-through) -->
  <rect x="270" y="190" width="80" height="80" fill="#666666" filter="url(#tortureBlur)"/>

  <!-- 9. Stroke-only path → expect: outline treatment only, never fill marks -->
  <path d="M 20 140 Q 100 110 180 140 T 340 140" fill="none" stroke="#111111" stroke-width="2"/>

  <!-- 10. symbol is referenced nowhere → expect: ZERO marks generated for it -->
</svg>
