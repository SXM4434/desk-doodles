<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="3000" height="3000" viewBox="0 0 800 800"  >
	<defs>
		<clipPath id="cut">
			<rect x="-200" y="-200" width="200" height="200"/>
		</clipPath>
		<pattern id="Pattern" patternUnits="userSpaceOnUse" x="-200" y="-200" width="400" height="400" viewBox="-200 -200 400 400" >
			<g id="g4" clip-path="url(#cut)">
				<g id="g3" >
					<g id="g2" >
						<g id="g1" >
							<circle r="1" cy="-10"  cx="-190" fill="#EF0075" />
							<circle r="2" cy="-10"  cx="-170" fill="#D900EF" />
							<circle r="3" cy="-10"  cx="-150" fill="#4A00EF" />
							<circle r="4" cy="-10"  cx="-130" fill="#0046EF" />
							<circle r="5" cy="-10"  cx="-110" fill="#00D5EF" />
							<circle r="6" cy="-10"  cx="-90" fill="#00EF7A" />
							<circle r="7" cy="-10"  cx="-70" fill="#16EF00" />
							<circle r="8" cy="-10"  cx="-50" fill="#A5EF00" />
							<circle r="9" cy="-10"  cx="-30" fill="#EFA900" />
							<circle r="10" cy="-10" cx="-10" fill="#EF1A00" />
						</g>
						<use xlink:href="#g1" x="20" y="-20"/>
						<use xlink:href="#g1" x="40" y="-40"/>
						<use xlink:href="#g1" x="60" y="-60"/>
						<use xlink:href="#g1" x="80" y="-80"/>
					</g>
					<use xlink:href="#g2" x="100" y="-100"/>
				</g>
				<use xlink:href="#g3" transform="rotate(180) translate(200,200)" />
			</g>
			<use xlink:href="#g4" transform="rotate(180)" />
			<use xlink:href="#g4" transform="rotate(90)" />
			<use xlink:href="#g4" transform="rotate(-90)" />
		</pattern>
	</defs>
	<rect fill="url(#Pattern)" width="800" height="800"/>
</svg>
